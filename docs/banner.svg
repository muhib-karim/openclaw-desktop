<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw Desktop</title>
  <desc id="desc">Banner: OpenClaw Desktop, a desktop control panel for the OpenClaw AI gateway</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1220"/>
      <stop offset="0.6" stop-color="#1a1530"/>
      <stop offset="1" stop-color="#2a1426"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b4a"/>
      <stop offset="1" stop-color="#ff9a5c"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>

  <!-- Title block -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="140" font-size="64" font-weight="700" fill="#f5f6fa">OpenClaw <tspan fill="url(#accent)">Desktop</tspan></text>
    <text x="82" y="190" font-size="24" fill="#c3c7d6">Desktop control panel for the OpenClaw AI gateway</text>
    <g font-size="16" fill="#9aa0b4">
      <rect x="82" y="222" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="134" y="242" text-anchor="middle">Tauri 2</text>
      <rect x="198" y="222" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="250" y="242" text-anchor="middle">Rust</text>
      <rect x="314" y="222" width="104" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="366" y="242" text-anchor="middle">React 19</text>
      <rect x="430" y="222" width="140" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
      <text x="500" y="242" text-anchor="middle">TypeScript</text>
    </g>
  </g>

  <!-- Motif: desktop window managing a local gateway -->
  <g transform="translate(830 64)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="300" height="192" rx="14" fill="#161a2b" stroke="#ffffff" stroke-opacity="0.14"/>
    <path d="M0 14a14 14 0 0 1 14-14h272a14 14 0 0 1 14 14v22H0z" fill="#20253a"/>
    <circle cx="20" cy="18" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="18" r="5" fill="#febc2e"/>
    <circle cx="56" cy="18" r="5" fill="#28c840"/>
    <circle cx="30" cy="70" r="8" fill="#3ddc84"/>
    <circle cx="30" cy="70" r="14" fill="none" stroke="#3ddc84" stroke-opacity="0.35" stroke-width="2"/>
    <text x="54" y="76" font-size="18" font-weight="600" fill="#e8eaf2">Gateway running</text>
    <rect x="22" y="104" width="78" height="28" rx="7" fill="url(#accent)"/>
    <text x="61" y="123" font-size="14" font-weight="600" fill="#1a1020" text-anchor="middle">Restart</text>
    <rect x="110" y="104" width="78" height="28" rx="7" fill="#ffffff" fill-opacity="0.08"/>
    <text x="149" y="123" font-size="14" fill="#c3c7d6" text-anchor="middle">Logs</text>
    <rect x="22" y="146" width="256" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="22" y="162" width="180" height="6" rx="3" fill="#ffffff" fill-opacity="0.08"/>
  </g>

  <!-- Link to local gateway -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M1130 160 H1196" stroke="#ff8a52" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
    <circle cx="1214" cy="160" r="18" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="1214" cy="160" r="6" fill="#ff8a52"/>
    <text x="1214" y="204" font-size="13" fill="#9aa0b4" text-anchor="middle">127.0.0.1</text>
    <text x="1214" y="222" font-size="13" fill="#9aa0b4" text-anchor="middle">:18789</text>
  </g>
</svg>
